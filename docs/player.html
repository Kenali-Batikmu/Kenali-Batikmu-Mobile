<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pemutar Video Kenali Batikmu</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1A1310;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    #notice {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      color: #F3E7D8;
      background: #1A1310;
    }
    #notice svg { opacity: 0.55; }
    #notice p { margin: 0; font-size: 13px; line-height: 1.5; color: #CBBBA8; }
    #notice strong { color: #E4BA73; font-size: 14px; }
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="player"
            src="about:blank"
            title="Video pembahasan motif batik"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <div id="notice">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none"
         stroke="#E4BA73" stroke-width="1.6" stroke-linecap="round">
      <rect x="2" y="4" width="20" height="16" rx="3"></rect>
      <path d="M10 9l5 3-5 3z" fill="#E4BA73" stroke="none"></path>
    </svg>
    <strong>Video tidak dapat diputar di sini</strong>
    <p>Pemilik video membatasi pemutaran di aplikasi lain.</p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var videoId = (params.get('v') || '').trim();

      // Validasi ketat: hanya ID YouTube (11 karakter aman) yang diterima.
      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        document.getElementById('notice').style.display = 'flex';
        return;
      }

      var origin = window.location.origin;
      var iframe = document.getElementById('player');
      iframe.src = 'https://www.youtube.com/embed/' + videoId +
        '?playsinline=1&rel=0&modestbranding=1&fs=1' +
        '&origin=' + encodeURIComponent(origin);

      // Tampilkan pemberitahuan bila YouTube menolak pemutaran (galat 101/150).
      window.addEventListener('message', function (event) {
        if (event.origin.indexOf('youtube.com') === -1) return;
        var data = event.data;
        if (typeof data !== 'string') return;
        if (data.indexOf('"event":"onError"') !== -1 ||
            data.indexOf('"event": "onError"') !== -1) {
          document.getElementById('notice').style.display = 'flex';
        }
      });
    })();
  </script>
</body>
</html>
